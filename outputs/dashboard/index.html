<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Brand Fit Screen</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<style>
:root {
  color-scheme: light;
  --bg: #ffffff; --bg-alt: #f5f5f7; --tile: #f5f5f7; --tile-hover: #ececef; --card: #ffffff;
  --ink: #1d1d1f; --ink-2: #6e6e73; --ink-3: #86868b; --line: #d2d2d7; --hair: rgba(0,0,0,.08);
  --link: #0066cc; --accent: #0071e3; --accent-ink: #ffffff;
  --good: #1a7f37; --good-soft: #e3f4e6; --bad: #c9252c; --bad-soft: #fde8e8;
  --track: #e8e8ed; --bar: #0071e3; --bar-dim: #a8c7f0; --line60: #1d1d1f;
  --nav: rgba(251,251,253,.8); --shadow: 0 2px 12px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #000000; --bg-alt: #101012; --tile: #161617; --tile-hover: #1e1e20; --card: #161617;
    --ink: #f5f5f7; --ink-2: #a1a1a6; --ink-3: #86868b; --line: #424245; --hair: rgba(255,255,255,.1);
    --link: #2997ff; --accent: #0a84ff; --accent-ink: #ffffff;
    --good: #30d158; --good-soft: #10301a; --bad: #ff6961; --bad-soft: #3a1416;
    --track: #2c2c2e; --bar: #0a84ff; --bar-dim: #1d4b80; --line60: #f5f5f7;
    --nav: rgba(22,22,23,.8); --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000; --bg-alt: #101012; --tile: #161617; --tile-hover: #1e1e20; --card: #161617;
  --ink: #f5f5f7; --ink-2: #a1a1a6; --ink-3: #86868b; --line: #424245; --hair: rgba(255,255,255,.1);
  --link: #2997ff; --accent: #0a84ff; --accent-ink: #ffffff;
  --good: #30d158; --good-soft: #10301a; --bad: #ff6961; --bad-soft: #3a1416;
  --track: #2c2c2e; --bar: #0a84ff; --bar-dim: #1d4b80; --line60: #f5f5f7;
  --nav: rgba(22,22,23,.8); --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  letter-spacing: -.022em; -webkit-font-smoothing: antialiased; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; letter-spacing: inherit; color: inherit; }
.wrap { max-width: 1024px; margin: 0 auto; padding: 0 22px; }
.wide { max-width: 1240px; }

/* Global nav */
.gnav { position: sticky; top: 0; z-index: 50; background: var(--nav); backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--hair); }
.gnav .wrap { display: flex; align-items: center; height: 48px; gap: 28px; }
.gnav .mark { font-weight: 600; font-size: 15px; letter-spacing: -.01em; color: var(--ink); }
.gnav nav { display: flex; gap: 26px; margin-left: auto; font-size: 13px; }
.gnav nav a { color: var(--ink); opacity: .8; }
.gnav nav a[aria-current="page"] { opacity: 1; font-weight: 600; }
.gnav nav a:hover { opacity: 1; text-decoration: none; }

/* Typography */
.eyebrow { color: var(--ink-2); font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 6px; }
.headline { font-size: clamp(40px, 7vw, 72px); line-height: 1.05; font-weight: 700; letter-spacing: -.015em; margin: 0; }
.sub { font-size: clamp(19px, 2.4vw, 26px); line-height: 1.25; color: var(--ink-2); font-weight: 500; margin: 12px 0 0; letter-spacing: -.01em; }
.h2 { font-size: clamp(28px, 4vw, 40px); line-height: 1.1; font-weight: 700; letter-spacing: -.005em; margin: 0 0 8px; }
.h3 { font-size: 21px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.fine { font-size: 12px; color: var(--ink-3); letter-spacing: -.01em; }

/* Hero */
.hero { text-align: center; padding: 72px 0 40px; }
.stats { display: flex; justify-content: center; gap: clamp(20px, 6vw, 64px); margin: 40px 0 0; flex-wrap: wrap; }
.stat b { display: block; font-size: clamp(32px, 5vw, 48px); font-weight: 700; letter-spacing: -.02em; line-height: 1.05; }
.stat span { color: var(--ink-2); font-size: 14px; }

/* Controls */
.controls { position: sticky; top: 48px; z-index: 40; background: var(--bg); padding: 14px 0 12px; border-bottom: 1px solid var(--hair); }
.controls .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.search { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; background: var(--bg-alt); border-radius: 12px; padding: 0 12px; height: 40px; }
.search input { border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; width: 100%; outline: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 10px 0 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip-btn { flex: none; border: 1px solid var(--line); background: transparent; border-radius: 980px; padding: 6px 16px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.chip-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip-btn .n { color: var(--ink-3); margin-left: 4px; }
.chip-btn[aria-pressed="true"] .n { color: inherit; opacity: .7; }
select.sort { appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 12px; height: 40px; padding: 0 34px 0 14px; font: inherit; font-size: 14px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 18px) 17px, calc(100% - 13px) 17px; background-size: 5px 5px; background-repeat: no-repeat; }

/* Groups and tiles */
.group { padding: 44px 0 8px; }
.group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.group-head .count { color: var(--ink-2); font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.tile { position: relative; background: var(--tile); border-radius: 22px; padding: 28px 26px 22px; display: flex; flex-direction: column; min-height: 320px;
  transition: background .2s ease, transform .3s cubic-bezier(.2,.8,.2,1); cursor: pointer; }
.tile:hover { background: var(--tile-hover); transform: translateY(-2px); }
.tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.tile .cat { color: var(--ink-2); font-size: 14px; font-weight: 600; }
.tile .name { font-size: 28px; line-height: 1.12; font-weight: 700; letter-spacing: -.01em; margin: 6px 0 12px; }
.tile .why { color: var(--ink-2); font-size: 15px; line-height: 1.4; margin: 0 0 18px; flex: 1; }
.tile .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; }
.tile .more { font-size: 15px; color: var(--link); }
.cmp-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; background: none; border: 0; padding: 4px 0; }
.cmp-toggle .box { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink-3); display: grid; place-items: center; }
.cmp-toggle[aria-pressed="true"] { color: var(--accent); }
.cmp-toggle[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.cmp-toggle[aria-pressed="true"] .box::after { content: ""; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px,-1px); }

/* Pills and dots */
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 980px; padding: 3px 11px; font-size: 13px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.pill.verdict { letter-spacing: .06em; font-weight: 700; padding: 3px 12px; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.neutral { background: var(--bg-alt); color: var(--ink-2); }
.dots { display: flex; gap: 6px; align-items: center; }
.dot { width: 26px; height: 6px; border-radius: 3px; background: var(--track); }
.dot.clear { background: var(--good); }
.dot.stage { background: var(--accent); }
.dot.miss { background: var(--bad); opacity: .85; }
.dots-legend { font-size: 12px; color: var(--ink-3); margin-top: 6px; }

/* Compare tray */
.tray { visibility: hidden; position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 140%); z-index: 60; transition: transform .35s cubic-bezier(.2,.8,.2,1);
  background: var(--nav); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border: 1px solid var(--hair); border-radius: 980px; padding: 8px 8px 8px 20px; display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.12);
  max-width: calc(100vw - 32px); }
.tray.show { transform: translate(-50%, 0); visibility: visible; }
.tray .names { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 980px; padding: 9px 20px; font-size: 15px; cursor: pointer; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--link); padding: 9px 10px; }
.btn:disabled { opacity: .4; cursor: default; }

/* Brand page */
.bhero { padding: 64px 0 36px; text-align: center; }
.bhero .headline { font-size: clamp(40px, 6.5vw, 64px); }
.bhero .pill { font-size: 15px; padding: 5px 14px; margin-top: 18px; }
.bhero .sub { max-width: 760px; margin-left: auto; margin-right: auto; }
.bhero .links { margin-top: 22px; display: flex; gap: 26px; justify-content: center; font-size: 17px; }
.glance { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 16px 0 0; }
.glance .g { background: var(--tile); border-radius: 18px; padding: 22px; }
.glance .g b { display: block; font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.glance .g span { color: var(--ink-2); font-size: 14px; }
.section { padding: 56px 0 8px; }
.section.alt { background: var(--bg-alt); padding-bottom: 56px; margin-top: 48px; }
.checks { display: grid; gap: 14px; margin-top: 22px; }
.check { background: var(--card); border-radius: 18px; padding: 20px 22px; display: grid; grid-template-columns: minmax(180px, 260px) 1fr auto; gap: 22px; align-items: center; box-shadow: var(--shadow); }
.section:not(.alt) .check { background: var(--tile); box-shadow: none; }
.check .t { font-weight: 600; font-size: 17px; }
.check .f { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.check .must { font-size: 11px; font-weight: 600; color: var(--ink-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-left: 8px; vertical-align: 2px; white-space: nowrap; }
.check .v { text-align: right; min-width: 128px; }
.check .v b { font-size: 28px; font-weight: 700; letter-spacing: -.02em; display: block; line-height: 1; margin-bottom: 6px; }
.meter { position: relative; height: 10px; background: var(--track); border-radius: 5px; }
.meter > i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--bar); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.meter.dim > i { background: var(--bar-dim); }
.meter > s { position: absolute; left: 60%; top: -5px; bottom: -5px; width: 2px; background: var(--line60); opacity: .5; border-radius: 1px; }
.meter-sm { height: 6px; }
.meter-sm > i { border-radius: 3px; }
.cov { color: var(--ink-3); font-size: 12px; margin-top: 4px; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; color: var(--ink-3); font-size: 12px; margin-top: 14px; align-items: center; }
.legend .l60 { display: inline-block; width: 2px; height: 12px; background: var(--line60); opacity: .5; vertical-align: -2px; margin-right: 6px; }

/* Tables */
.tbl-wrap { overflow-x: auto; margin-top: 18px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); }
.section:not(.alt) .tbl-wrap { background: var(--tile); box-shadow: none; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--hair); vertical-align: middle; }
th { color: var(--ink-2); font-weight: 600; font-size: 12px; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
details { margin-top: 18px; }
summary { cursor: pointer; color: var(--link); font-size: 17px; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::after { content: " +"; }
details[open] summary::after { content: " –"; }
.seg { display: inline-flex; background: var(--bg-alt); border-radius: 10px; padding: 2px; }
.section.alt .seg { background: var(--card); }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.section.alt .seg button[aria-pressed="true"] { background: var(--bg-alt); }

/* Compare page */
.cmp-grid { display: grid; gap: 0; margin-top: 28px; }
.cmp-row { display: grid; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--hair); align-items: center; }
.cmp-row .lab { font-weight: 600; font-size: 15px; }
.cmp-head { align-items: end; }
.cmp-head .bn { font-size: 21px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
.cmp-cell b { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.empty { text-align: center; padding: 80px 0; color: var(--ink-2); }

.subgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; margin-top: 22px; }
.subcard { background: var(--card); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }
.section:not(.alt) .subcard { background: var(--tile); box-shadow: none; }
.subcard .nm { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
.kpis b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.kpis span { color: var(--ink-2); font-size: 12px; }
.rankline { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.rankline a { font-weight: 600; }
.hbar { display: grid; grid-template-columns: minmax(130px, 200px) 1fr 90px; gap: 14px; align-items: center; padding: 8px 0; }
.hbar .track { height: 18px; background: var(--track); border-radius: 5px; position: relative; }
.hbar .track i { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 5px; }
.hbar .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; }
tr.me td { background: var(--good-soft); }
tr.me td:first-child { font-weight: 700; }
.sharebar { height: 6px; background: var(--track); border-radius: 3px; position: relative; min-width: 80px; }
.sharebar i { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 3px; }
.eyelink { color: var(--ink-2); }
.eyelink:hover { color: var(--link); }
footer { border-top: 1px solid var(--hair); margin-top: 72px; padding: 22px 0 90px; color: var(--ink-3); font-size: 12px; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 8px; max-width: 260px; z-index: 80; display: none; line-height: 1.35; }

@media (max-width: 760px) {
  .gnav .wrap { gap: 14px; }
  .gnav .mark { white-space: nowrap; font-size: 14px; }
  .gnav nav { gap: 14px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; font-size: 12px; }
  .gnav nav::-webkit-scrollbar { display: none; }
  .glance { grid-template-columns: repeat(2, 1fr); }
  .check { grid-template-columns: 1fr auto; }
  .check .meter { grid-column: 1 / -1; order: 3; }
  .hero { padding-top: 48px; }
  .tray .names { max-width: 38vw; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

function results() {
  const q = ui.q.trim().toLowerCase();

    recent: (a, b) => b.asof.localeCompare(a.asof), name: (a, b) => a.name.localeCompare(b.name), group: (a, b) => a.name.localeCompare(b.name) };
  list.sort(sorters[ui.sort] || sorters.name);

      </div>
    </article>`;
  const grouped = ui.sort === "group" && ui.group === "All";
  const sections = grouped ? [...new Set(list.map(b => b.group))].sort().map(g => [g, list.filter(b => b.group === g)]) : [[null, list]];
  el.innerHTML = sections.map(([g, items]) => `
    <section class="group">
      ${g ? `<div class="group-head"><h2 class="h2">${esc(g)}</h2><span class="count">${items.length} brand${items.length > 1 ? "s" : ""}</span></div>`
          : `<div class="group-head"><span class="count">${items.length} brand${items.length > 1 ? "s" : ""}</span></div>`}
      <div class="tiles">${items.map(tile).join("")}</div>
    </section>`).join("");
  el.querySelectorAll("[data-go]").forEach(t => {
    t.onclick = e => { if (e.target.closest("[data-pick]")) return; location.hash = "#/brand/" + t.dataset.go; };
    t.onkeydown = e => { if (e.key === "Enter" && !e.target.closest("[data-pick]")) location.hash = "#/brand/" + t.dataset.go; };
  });
  el.querySelectorAll("[data-pick]").forEach(b => b.onclick = e => { e.stopPropagation(); togglePick(b.dataset.pick); });
  syncTray();
}

      <a class="tile" href="#/brand/${p.key}" style="min-height:0;color:inherit;text-decoration:none">

        <div>${tierPill(p)}</div><div style="margin-top:16px">${dots(p)}</div>
        <div class="foot"><span class="more">Learn more ›</span></div></a>`).join("")}</div>
  </section>`;
}
function competes(b) {
  const c = CATS.find(x => x.name === b.group); if (!c) return "";
  const rows = c.subs.map(x => ({ x, s: x.screened.find(s => s.key === b.key) })).filter(r => r.s);
  if (!rows.length) return "";
  return `<section class="section wrap">
    <p class="eyebrow">Where it competes</p><h2 class="h2">Its place in each market.</h2>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Sub-category</th><th class="num">Market, ₹ cr/month</th><th class="num">Rank</th><th>Share of sales</th><th>Leader</th><th class="num">Market YoY*</th></tr></thead>
      <tbody>${rows.map(({x, s}) => `<tr><td>${esc(x.name)}</td><td class="num">${cr(x.revenue)}</td><td class="num">#${s.rank}</td>
        <td><div style="display:flex;align-items:center;gap:8px"><div class="sharebar" style="flex:1;max-width:160px"><i style="width:${Math.min(100, s.revShare / x.top[0].revShare * 100)}%"></i></div><span class="small">${s.revShare}%</span></div></td>
        <td>${esc(x.leader)} (${x.top[0].revShare}%)</td><td class="num">${pct(x.yoy)}</td></tr>`).join("")}</tbody></table></div>
    <p class="fine" style="margin-top:10px">Amazon India, Helium 10 estimates. Share bars are relative to the sub-category leader. <a href="#/category/${c.slug}">See the full ${esc(c.name)} view ›</a></p>
  </section>`;
}

/* Method */
function method() {
  app.innerHTML = `
  <section class="hero wrap"><p class="eyebrow">How it works</p><h1 class="headline">Signals in.<br>Decision out.</h1>
    <p class="sub">Three layers turn outside-in marketplace data into a FIT or NO FIT you can trace back to its source.</p></section>
  <section class="section alt"><div class="wrap">
    <div class="glance" style="grid-template-columns:repeat(3,1fr)">
      <div class="g"><b>49</b><span>raw signals, each scored 0–100 between a floor and a ceiling</span></div>
      <div class="g"><b>13</b><span>mid-layer metrics, each a weighted average of its signals</span></div>
      <div class="g"><b>6</b><span>checks, each met at 60; two of them are gates</span></div>
    </div>
    <div class="checks">${SCORED[0].checks.map(c => `<div class="check" style="grid-template-columns:minmax(180px,260px) 1fr">
      <div class="t">${esc(SHORT[c.name] || c.name)}${c.must ? '<span class="must">Gate</span>' : ""}</div><div class="muted small">${esc(c.formula)}</div></div>`).join("")}</div>
  </div></section>
  <section class="section wrap">
    <h2 class="h2">FIT or NO FIT.</h2>
    <p class="muted">Every brand is a FIT or a NO FIT. A brand is a FIT when it gets through both gates (Customer quality and Pricing power) and meets at least four of the six checks. Anything else is a NO FIT. A check is met at a score of 60 or more. Signals that could not be measured are left out and the rest re-weighted; "data measured" shows how much of the weight is real.</p>
    <h2 class="h2" style="margin-top:40px">Young brands.</h2>
    <p class="muted">When listings with a year-ago sales figure cover less than half of a brand's revenue, the two SKU spikiness growth signals use 90-day sales growth divided by the category's own 90-day growth, which removes the festive lift.</p>
    <h2 class="h2" style="margin-top:40px">Sources.</h2>
    <p class="muted">Helium 10, Keepa, GobbleCube, and reads of Amazon, Flipkart, brand websites, Meta Ad Library, Instagram and quick-commerce apps. Sales are estimates for the 30 days to late November 2026, a window that includes Diwali. Each brand's full report carries the detail and caveats.</p>
  </section>`;
}

/* Router */
function route() {
  const h = location.hash.replace(/^#\/?/, "");
  const [page, arg] = h.split("/");
  document.querySelectorAll("[data-nav]").forEach(a => a.setAttribute("aria-current", (a.dataset.nav === (page || "home") || (a.dataset.nav === "home" && page === "brand") || (a.dataset.nav === "categories" && page === "category")) ? "page" : "false"));
  if (page === "brand") brand(arg);
  else if (page === "compare") compare(arg ? arg.split(",").filter(Boolean) : null);
  else if (page === "method") method();
  else if (page === "categories") categoriesIndex();
  else if (page === "category") category(arg);
  else home();
  syncTray();
  window.scrollTo({ top: 0 });
}
addEventListener("hashchange", route);
route();
</script>
<footer><div class="wrap wide">Brand Fit Screen · internal diligence tool · scores are estimates from outside-in data and are not a substitute for the brand's own numbers.</div></footer>
</body>
</html>
